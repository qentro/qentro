<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qentro | Üyeliği Tamamla</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #151515 0%, #080808 45%, #000 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 460px;
  padding: 38px 34px;
  border-radius: 28px;
  background: rgba(22,22,22,0.78);
  border: 1px solid rgba(255,255,255,0.09);
  box-shadow: 0 35px 80px rgba(0,0,0,0.55);
}

h1 {
  font-size: 34px;
  margin: 0 0 10px;
}

p {
  margin: 0 0 24px;
  color: #aaa;
  font-size: 14px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #d0d0d0;
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 15px 16px;
  margin-bottom: 16px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.11);
  background: linear-gradient(90deg, #2a2a2a, #202020);
  color: #fff;
  outline: none;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 8px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.12);
  background: linear-gradient(90deg, #333, #222);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.secondary {
  background: linear-gradient(90deg, #292929, #1b1b1b);
  margin-top: 12px;
}

button:hover {
  filter: brightness(1.12);
}
</style>
</head>

<body>

<div class="card">
  <h1>Üyeliği Tamamla</h1>
  <p>Onaylı davet kodunuzla hesabınızı oluşturun.</p>

  <label>Ad Soyad</label>
  <input id="fullName">

  <label>Email</label>
  <input id="email" type="email">

  <label>Davet Kodu</label>
  <input id="code">

  <label>Şifre Oluştur</label>
  <input id="password" type="password">

  <button onclick="completeMembership()">Üyeliği Tamamla</button>
  <button class="secondary" onclick="goLogin()">Giriş Sayfasına Dön</button>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

window.onload = function() {
  const savedEmail = localStorage.getItem("q_email");
  const savedCode = localStorage.getItem("q_code");

  if (savedEmail) {
    document.getElementById("email").value = savedEmail;
  }

  if (savedCode) {
    document.getElementById("code").value = savedCode;
  }
};

async function completeMembership() {
  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const code = document.getElementById("code").value.trim().toUpperCase();
  const password = document.getElementById("password").value;

  if (!fullName || !email || !code || !password) {
    alert("Lütfen tüm alanları doldurun.");
    return;
  }

  if (password.length < 6) {
    alert("Şifre en az 6 karakter olmalı.");
    return;
  }

  const { data: application, error: appError } = await supabaseClient
    .from("applications")
    .select("*")
    .eq("email", email)
    .eq("invite_code", code)
    .eq("status", "approved")
    .single();

  if (appError || !application) {
    alert("Onaylı başvuru bulunamadı.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        full_name: fullName,
        invite_code: code
      }
    }
  });

  if (error) {
    alert("Üyelik oluşturulamadı: " + error.message);
    return;
  }

  await supabaseClient
    .from("applications")
    .update({ status: "completed" })
    .eq("id", application.id);

  alert("Üyelik tamamlandı. Şimdi giriş yapabilirsiniz.");
  window.location.href = "login.html";
}

function goLogin() {
  window.location.href = "login.html";
}
</script>

</body>
</html>

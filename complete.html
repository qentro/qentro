let currentLang = localStorage.getItem("qentroLang") || "en";

function setLang(code) {
  const t = texts[code] || texts.en;
  currentLang = code;

  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.title = t.pageTitle;

  document.getElementById("title").innerHTML = t.title;
  document.getElementById("subtitle").innerHTML = t.subtitle;
  document.getElementById("fullNameLabel").innerHTML = t.fullNameLabel;
  document.getElementById("emailLabel").innerHTML = t.emailLabel;
  document.getElementById("codeLabel").innerHTML = t.codeLabel;
  document.getElementById("passwordLabel").innerHTML = t.passwordLabel;
  document.getElementById("completeBtn").innerHTML = t.completeBtn;
  document.getElementById("loginBtn").innerHTML = t.loginBtn;

  document.querySelectorAll(".lang-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.lang === code);
  });

  localStorage.setItem("qentroLang", code);
}

document.querySelectorAll(".lang-btn").forEach(button => {
  button.addEventListener("click", function () {
    setLang(this.dataset.lang);
  });
});

window.onload = function() {
  const savedEmail = localStorage.getItem("q_email");
  const savedCode = localStorage.getItem("q_code");

  if (savedEmail) {
    document.getElementById("email").value = savedEmail;
  }

  if (savedCode) {
    document.getElementById("code").value = savedCode;
  }

  setLang(currentLang);
};

async function completeMembership() {
  const t = texts[currentLang] || texts.en;

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const code = document.getElementById("code").value.trim().toUpperCase();
  const password = document.getElementById("password").value;

  if (!fullName || !email || !code || !password) {
    alert(t.required);
    return;
  }

  if (password.length < 6) {
    alert(t.shortPassword);
    return;
  }

  const { data: application, error: appError } = await supabaseClient
    .from("applications")
    .select("*")
    .eq("email", email)
    .eq("invite_code", code)
    .eq("status", "approved")
    .single();

  if (appError || !application) {
    alert(t.noApplication);
    return;
  }

  const { error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        full_name: fullName,
        invite_code: code
      }
    }
  });

  if (error) {
    alert(t.createError + error.message);
    return;
  }

  await supabaseClient
    .from("applications")
    .update({ status: "completed" })
    .eq("id", application.id);

  alert(t.success);
  window.location.href = "login.html";
}

function goLogin() {
  window.location.href = "login.html";
}

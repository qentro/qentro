<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qentro | Üye Girişi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #151515 0%, #080808 45%, #000 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 460px;
  padding: 38px 34px;
  border-radius: 28px;
  background: rgba(22,22,22,0.78);
  border: 1px solid rgba(255,255,255,0.09);
  box-shadow: 0 35px 80px rgba(0,0,0,0.55);
}

h1 {
  font-size: 38px;
  margin: 0 0 12px;
}

p {
  margin: 0 0 28px;
  color: #aaa;
  font-size: 15px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #d0d0d0;
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 15px 16px;
  margin-bottom: 18px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.11);
  background: linear-gradient(90deg, #2a2a2a, #202020);
  color: #fff;
  outline: none;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 8px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.12);
  background: linear-gradient(90deg, #333, #222);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.secondary {
  background: linear-gradient(90deg, #292929, #1b1b1b);
  margin-top: 12px;
}

button:hover {
  filter: brightness(1.12);
}

#msg {
  margin-top: 16px;
  color: #aaa;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
  <h1>Üye Girişi</h1>
  <p>Onaylı üyeler e-mail ve şifre ile giriş yapabilir.</p>

  <label>Email</label>
  <input id="email" type="email" autocomplete="email">

  <label>Şifre</label>
  <input id="pass" type="password" autocomplete="current-password">

  <button onclick="login()">Giriş Yap</button>
  <button class="secondary" onclick="forgotPassword()">Şifremi Unuttum</button>
  <button class="secondary" onclick="goHome()">Ana Sayfaya Dön</button>

  <div id="msg"></div>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

async function login() {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("pass").value;

  if (!email || !password) {
    alert("Lütfen email ve şifre girin.");
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("Giriş hatası: " + error.message);
    return;
  }

  window.location.href = "dashboard.html";
}

async function forgotPassword() {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const msg = document.getElementById("msg");

  if (!email) {
    alert("Lütfen önce email adresinizi yazın.");
    return;
  }

  msg.textContent = "Şifre yenileme linki gönderiliyor...";

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://www.qentro.com/reset.html"
  });

  if (error) {
    msg.textContent = "Hata: " + error.message;
    return;
  }

  msg.textContent = "Şifre yenileme linki email adresinize gönderildi. Lütfen gelen kutunuzu kontrol edin.";
}

function goHome() {
  window.location.href = "index.html";
}
</script>

</body>
</html>

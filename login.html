<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qentro | Member Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 26%),
    radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 22%),
    linear-gradient(135deg, #050505, #0b0b0b 45%, #111 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.page {
  width: 100%;
  max-width: 520px;
}

.language-bar {
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.lang-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: auto;
  min-width: 42px;
  padding: 9px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.78);
  cursor: pointer;
  font-size: 12px;
  letter-spacing: 0.05em;
  font-weight: 700;
  user-select: none;
}

.lang-btn.active,
.lang-btn:hover {
  background: #fff;
  color: #000;
}

.card {
  width: 100%;
  padding: 38px 34px;
  border-radius: 28px;
  background: rgba(22,22,22,0.78);
  border: 1px solid rgba(255,255,255,0.11);
  box-shadow: 0 35px 80px rgba(0,0,0,0.55);
}

h1 {
  font-size: 38px;
  margin: 0 0 12px;
  letter-spacing: -0.04em;
}

p {
  margin: 0 0 28px;
  color: rgba(255,255,255,0.68);
  font-size: 15px;
  line-height: 1.6;
}

label {
  display: block;
  margin-bottom: 8px;
  color: rgba(255,255,255,0.82);
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 15px 16px;
  margin-bottom: 18px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.12);
  background: linear-gradient(90deg, #2a2a2a, #202020);
  color: #fff;
  outline: none;
  font-size: 15px;
}

.action-btn {
  width: 100%;
  padding: 16px;
  margin-top: 8px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.13);
  background: linear-gradient(90deg, #333, #222);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.secondary {
  background: linear-gradient(90deg, #292929, #1b1b1b);
  margin-top: 12px;
}

.action-btn:hover {
  filter: brightness(1.12);
}

#msg {
  margin-top: 16px;
  color: rgba(255,255,255,0.68);
  font-size: 14px;
  line-height: 1.5;
}

@media (max-width: 560px) {
  body {
    padding: 16px;
  }

  .card {
    padding: 30px 24px;
    border-radius: 24px;
  }

  h1 {
    font-size: 34px;
  }

  .lang-btn {
    min-width: 38px;
    font-size: 11px;
    padding: 8px 10px;
  }
}
</style>
</head>

<body>

<div class="page">
<div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:18px;">

  <span onclick="setLang('en')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">EN</span>
  <span onclick="setLang('ar')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">AR</span>
  <span onclick="setLang('bn')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">BN</span>
  <span onclick="setLang('zh')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">中文</span>
  <span onclick="setLang('fr')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">FR</span>
  <span onclick="setLang('de')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">DE</span>
  <span onclick="setLang('hi')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">HI</span>
  <span onclick="setLang('it')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">IT</span>
  <span onclick="setLang('ja')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">JA</span>
  <span onclick="setLang('fa')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">FA</span>
  <span onclick="setLang('ru')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">RU</span>
  <span onclick="setLang('es')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:12px;cursor:pointer;">ES</span>
  <span onclick="setLang('tr')" style="padding:8px 12px;border-radius:999px;border:1px solid #444;background:#fff;color:#000;font-size:12px;cursor:pointer;">TR</span>

</div>

  <div class="card">
    <h1 id="title">Member Login</h1>
    <p id="subtitle">Approved members can sign in with their email and password.</p>

    <label id="emailLabel">Email</label>
    <input id="email" type="email" autocomplete="email">

    <label id="passwordLabel">Password</label>
    <input id="pass" type="password" autocomplete="current-password">

    <button id="loginBtn" class="action-btn" onclick="login()">Sign In</button>
    <button id="forgotBtn" class="action-btn secondary" onclick="forgotPassword()">Forgot Password</button>
    <button id="homeBtn" class="action-btn secondary" onclick="goHome()">Back to Home</button>

    <div id="msg"></div>
  </div>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

const texts = {
  en: {
    lang: "en", dir: "ltr",
    pageTitle: "Qentro | Member Login",
    title: "Member Login",
    subtitle: "Approved members can sign in with their email and password.",
    emailLabel: "Email",
    passwordLabel: "Password",
    loginBtn: "Sign In",
    forgotBtn: "Forgot Password",
    homeBtn: "Back to Home",
    emptyAlert: "Please enter your email and password.",
    loginError: "Login error: ",
    emailFirst: "Please enter your email address first.",
    sending: "Sending password reset link...",
    error: "Error: ",
    sent: "Password reset link has been sent to your email address. Please check your inbox."
  },
  tr: {
    lang: "tr", dir: "ltr",
    pageTitle: "Qentro | Üye Girişi",
    title: "Üye Girişi",
    subtitle: "Onaylı üyeler e-mail ve şifre ile giriş yapabilir.",
    emailLabel: "Email",
    passwordLabel: "Şifre",
    loginBtn: "Giriş Yap",
    forgotBtn: "Şifremi Unuttum",
    homeBtn: "Ana Sayfaya Dön",
    emptyAlert: "Lütfen email ve şifre girin.",
    loginError: "Giriş hatası: ",
    emailFirst: "Lütfen önce email adresinizi yazın.",
    sending: "Şifre yenileme linki gönderiliyor...",
    error: "Hata: ",
    sent: "Şifre yenileme linki email adresinize gönderildi. Lütfen gelen kutunuzu kontrol edin."
  }
};

let currentLang = localStorage.getItem("qentroLang") || "en";

function setLang(code) {
  const t = texts[code] || texts.en;
  currentLang = code;

  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.title = t.pageTitle;

  document.getElementById("title").innerHTML = t.title;
  document.getElementById("subtitle").innerHTML = t.subtitle;
  document.getElementById("emailLabel").innerHTML = t.emailLabel;
  document.getElementById("passwordLabel").innerHTML = t.passwordLabel;
  document.getElementById("loginBtn").innerHTML = t.loginBtn;
  document.getElementById("forgotBtn").innerHTML = t.forgotBtn;
  document.getElementById("homeBtn").innerHTML = t.homeBtn;

  document.querySelectorAll(".lang-btn").forEach(item => {
    item.classList.toggle("active", item.dataset.lang === code);
  });

  localStorage.setItem("qentroLang", code);
}

document.querySelectorAll(".lang-btn").forEach(item => {
  item.addEventListener("click", function () {
    setLang(this.dataset.lang);
  });
});

async function login() {
  const t = texts[currentLang] || texts.en;
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("pass").value;

  if (!email || !password) {
    alert(t.emptyAlert);
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert(t.loginError + error.message);
    return;
  }

  window.location.href = "dashboard.html";
}

async function forgotPassword() {
  const t = texts[currentLang] || texts.en;
  const email = document.getElementById("email").value.trim().toLowerCase();
  const msg = document.getElementById("msg");

  if (!email) {
    alert(t.emailFirst);
    return;
  }

  msg.textContent = t.sending;

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://www.qentro.com/reset.html"
  });

  if (error) {
    msg.textContent = t.error + error.message;
    return;
  }

  msg.textContent = t.sent;
}

function goHome() {
  window.location.href = "index.html";
}

setLang(currentLang);
</script>

</body>
</html>

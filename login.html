<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qentro | Member Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
html,body{min-height:100%}
body{background:radial-gradient(circle at top left,rgba(255,255,255,.08),transparent 26%),radial-gradient(circle at bottom right,rgba(255,255,255,.05),transparent 22%),linear-gradient(135deg,#050505,#0b0b0b 45%,#111 100%);color:#fff;padding:22px}
.container{width:100%;max-width:1180px;margin:0 auto;min-height:calc(100vh - 90px);display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.hero,.panel{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;padding:42px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.hero{min-height:590px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:28px}
.dot{width:9px;height:9px;border-radius:999px;background:#fff;box-shadow:0 0 20px rgba(255,255,255,.8)}
.hero h1{font-size:clamp(48px,7vw,86px);line-height:.95;letter-spacing:-.055em;margin-bottom:28px}
.lead{max-width:610px;color:rgba(255,255,255,.78);font-size:18px;line-height:1.65}
.panel h2{font-size:32px;margin-bottom:14px;letter-spacing:-.03em}
.panel p{color:rgba(255,255,255,.72);line-height:1.65;margin-bottom:28px;font-size:16px}
label{display:block;margin-bottom:8px;color:rgba(255,255,255,.82);font-size:14px;font-weight:600}
input{width:100%;padding:16px;margin-bottom:18px;border-radius:16px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.065);color:#fff;outline:none;font-size:15px}
.login-actions{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.login-btn{width:100%;padding:18px 20px;border-radius:20px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.13);color:#fff;cursor:pointer;font-size:15px;font-weight:800;text-align:left;transition:.2s ease}
.login-btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
#msg{margin-top:16px;color:rgba(255,255,255,.68);font-size:14px;line-height:1.5}
@media(max-width:980px){.container{grid-template-columns:1fr}.hero{min-height:auto}}
@media(max-width:560px){body{padding:15px}.hero,.panel{padding:28px;border-radius:22px}.hero h1{font-size:48px}.lead{font-size:16px}}
</style>
</head>

<body>

<div class="language-bar" style="width:100%!important;max-width:1180px!important;margin:0 auto 18px!important;display:flex!important;flex-direction:row!important;justify-content:flex-end!important;align-items:center!important;gap:8px!important;flex-wrap:wrap!important;">
  <span data-lang="en" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">EN</span>
  <span data-lang="ar" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">AR</span>
  <span data-lang="bn" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">BN</span>
  <span data-lang="zh" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">中文</span>
  <span data-lang="fr" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">FR</span>
  <span data-lang="de" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">DE</span>
  <span data-lang="hi" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">HI</span>
  <span data-lang="it" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">IT</span>
  <span data-lang="ja" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">JA</span>
  <span data-lang="fa" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">FA</span>
  <span data-lang="ru" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">RU</span>
  <span data-lang="es" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">ES</span>
  <span data-lang="tr" style="width:auto!important;min-width:34px!important;display:inline-flex!important;flex:0 0 auto!important;padding:9px 12px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.78)!important;font-size:12px!important;font-weight:700!important;line-height:1!important;letter-spacing:.05em!important;cursor:pointer!important;">TR</span>
</div>

<main class="container">
  <section class="hero">
    <div class="eyebrow">
      <span class="dot"></span>
      <span id="eyebrow">QENTRO MEMBER ACCESS</span>
    </div>
    <h1 id="headline">Private member entry.</h1>
    <p class="lead" id="lead">This area is reserved for approved Qentro members. Use your verified email and password to continue.</p>
  </section>

  <aside class="panel">
    <h2 id="title">Member Login</h2>
    <p id="subtitle">Approved members can sign in with their email and password.</p>

    <label id="emailLabel">Email</label>
    <input id="email" type="email" autocomplete="email" />

    <label id="passwordLabel">Password</label>
    <input id="pass" type="password" autocomplete="current-password" />

    <div class="login-actions">
      <button id="loginBtn" class="login-btn" onclick="login()">Sign In</button>
      <button id="forgotBtn" class="login-btn" onclick="forgotPassword()">Forgot Password</button>
      <button id="homeBtn" class="login-btn" onclick="goHome()">Back to Home</button>
    </div>

    <div id="msg"></div>
  </aside>
</main>

<script>
const supabaseClient = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

const texts = {
  en: {
    lang: "en", dir: "ltr",
    eyebrow: "QENTRO MEMBER ACCESS",
    headline: "Private member entry.",
    lead: "This area is reserved for approved Qentro members. Use your verified email and password to continue.",
    title: "Member Login",
    subtitle: "Approved members can sign in with their email and password.",
    emailLabel: "Email",
    passwordLabel: "Password",
    loginBtn: "Sign In",
    forgotBtn: "Forgot Password",
    homeBtn: "Back to Home",
    emptyAlert: "Please enter your email and password.",
    loginError: "Login error: ",
    emailFirst: "Please enter your email address first.",
    sending: "Sending password reset link...",
    error: "Error: ",
    sent: "Password reset link has been sent to your email address."
  },
  tr: {
    lang: "tr", dir: "ltr",
    eyebrow: "QENTRO ÜYE GİRİŞİ",
    headline: "Özel üye girişi.",
    lead: "Bu alan yalnızca onaylı Qentro üyeleri içindir. Devam etmek için doğrulanmış email ve şifrenizi kullanın.",
    title: "Üye Girişi",
    subtitle: "Onaylı üyeler e-mail ve şifre ile giriş yapabilir.",
    emailLabel: "Email",
    passwordLabel: "Şifre",
    loginBtn: "Giriş Yap",
    forgotBtn: "Şifremi Unuttum",
    homeBtn: "Ana Sayfaya Dön",
    emptyAlert: "Lütfen email ve şifre girin.",
    loginError: "Giriş hatası: ",
    emailFirst: "Lütfen önce email adresinizi yazın.",
    sending: "Şifre yenileme linki gönderiliyor...",
    error: "Hata: ",
    sent: "Şifre yenileme linki email adresinize gönderildi."
  }
};

let currentLang = localStorage.getItem("qentroLang") || "en";

function setLang(code) {
  const t = texts[code] || texts.en;
  currentLang = code;

  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;

  document.getElementById("eyebrow").innerHTML = t.eyebrow;
  document.getElementById("headline").innerHTML = t.headline;
  document.getElementById("lead").innerHTML = t.lead;
  document.getElementById("title").innerHTML = t.title;
  document.getElementById("subtitle").innerHTML = t.subtitle;
  document.getElementById("emailLabel").innerHTML = t.emailLabel;
  document.getElementById("passwordLabel").innerHTML = t.passwordLabel;
  document.getElementById("loginBtn").innerHTML = t.loginBtn;
  document.getElementById("forgotBtn").innerHTML = t.forgotBtn;
  document.getElementById("homeBtn").innerHTML = t.homeBtn;

  document.querySelectorAll(".language-bar span").forEach(item => {
    item.style.background = item.dataset.lang === code ? "#fff" : "rgba(255,255,255,0.06)";
    item.style.color = item.dataset.lang === code ? "#000" : "rgba(255,255,255,0.78)";
  });

  localStorage.setItem("qentroLang", code);
}

document.querySelectorAll(".language-bar span").forEach(item => {
  item.addEventListener("click", function () {
    setLang(this.dataset.lang);
  });
});

async function login() {
  const t = texts[currentLang] || texts.en;
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("pass").value;

  if (!email || !password) {
    alert(t.emptyAlert);
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    alert(t.loginError + error.message);
    return;
  }

  window.location.href = "dashboard.html";
}

async function forgotPassword() {
  const t = texts[currentLang] || texts.en;
  const email = document.getElementById("email").value.trim().toLowerCase();
  const msg = document.getElementById("msg");

  if (!email) {
    alert(t.emailFirst);
    return;
  }

  msg.textContent = t.sending;

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://www.qentro.com/reset.html"
  });

  msg.textContent = error ? t.error + error.message : t.sent;
}

function goHome() {
  window.location.href = "index.html";
}

setLang(currentLang);
</script>
</body>
</html>

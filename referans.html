<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Qentro | Üyelik Girişi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  width: 420px;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
}

button {
  cursor: pointer;
}

.primary {
  background: white;
  color: black;
}

.secondary {
  background: #222;
  color: white;
}
</style>
</head>

<body>

<div class="box">
  <h2>Qentro Access</h2>

  <input id="name" placeholder="Ad Soyad">
  <input id="email" placeholder="Email">
  <input id="ref" placeholder="Size Referans Olan Kişi">
  <input id="code" placeholder="Davet Kodu">

  <button class="primary" onclick="checkAccess()">Giriş Yap</button>
  <button class="secondary" onclick="goHome()">Ana Sayfa</button>
</div>

<script>
const { createClient } = supabase;

const client = createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

async function checkAccess() {
  const email = document.getElementById("email").value;
  const code = document.getElementById("code").value;

  const { data } = await client
    .from("applications")
    .select("*")
    .eq("email", email)
    .eq("invite_code", code)
    .eq("status", "approved");

  if (!data || data.length === 0) {
    alert("Davet kodu veya email hatalı");
    return;
  }

  // geçici olarak bilgiyi sakla
  localStorage.setItem("q_email", email);

  // ikinci sayfaya geç
  window.location.href = "complete.html";
}

function goHome() {
  window.location.href = "index.html";
}
</script>

</body>
</html>

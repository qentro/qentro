<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qentro | Referanslı Erişim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  background: radial-gradient(circle at center, #0d0d0d, #000);
  color:#fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  width:420px;
  padding:30px;
  border-radius:20px;
  background: rgba(20,20,20,0.6);
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}

h2 {
  margin-bottom:8px;
}

.sub {
  color:#aaa;
  font-size:14px;
  margin-bottom:20px;
}

input {
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  outline:none;
  color:#fff;
  background: linear-gradient(90deg,#2a2a2a,#1c1c1c);
}

button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:600;
}

.primary {
  background: linear-gradient(90deg,#3a3a3a,#1f1f1f);
  color:#fff;
}

.secondary {
  background:#111;
  color:#888;
}

.primary:hover {
  opacity:0.9;
}
</style>
</head>

<body>

<div class="card">
  <h2>Referanslı Erişim</h2>
  <div class="sub">Onaylı kullanıcılar erişebilir</div>

  <input id="name" placeholder="Ad Soyad">
  <input id="email" placeholder="Email">
  <input id="ref" placeholder="Referans Olan Kişi">
  <input id="code" placeholder="Davet Kodu">

  <button class="primary" onclick="checkAccess()">Erişimi Doğrula</button>
  <button class="secondary" onclick="goHome()">Ana Sayfa</button>
</div>

<script>
const { createClient } = supabase;

const client = createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

async function checkAccess() {
  const email = document.getElementById("email").value;
  const code = document.getElementById("code").value;

  const { data } = await client
    .from("applications")
    .select("*")
    .eq("email", email)
    .eq("invite_code", code)
    .eq("status", "approved");

  if (!data || data.length === 0) {
    alert("Hatalı bilgi");
    return;
  }

  localStorage.setItem("q_email", email);
  window.location.href = "complete.html";
}

function goHome() {
  window.location.href = "index.html";
}
</script>

</body>
</html>

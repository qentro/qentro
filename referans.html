let currentLang = localStorage.getItem("qentroLang") || "en";

function setLang(code) {
  const t = texts[code] || texts.en;
  currentLang = code;

  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.title = t.pageTitle;

  document.getElementById("title").innerHTML = t.title;
  document.getElementById("subtitle").innerHTML = t.subtitle;
  document.getElementById("nameLabel").innerHTML = t.nameLabel;
  document.getElementById("emailLabel").innerHTML = t.emailLabel;
  document.getElementById("refLabel").innerHTML = t.refLabel;
  document.getElementById("codeLabel").innerHTML = t.codeLabel;
  document.getElementById("accessBtn").innerHTML = t.accessBtn;
  document.getElementById("homeBtn").innerHTML = t.homeBtn;

  document.querySelectorAll(".lang-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.lang === code);
  });

  localStorage.setItem("qentroLang", code);
}

document.querySelectorAll(".lang-btn").forEach(button => {
  button.addEventListener("click", function () {
    setLang(this.dataset.lang);
  });
});

async function checkAccess() {
  const t = texts[currentLang] || texts.en;

  const email = document.getElementById("email").value.trim().toLowerCase();
  const code = document.getElementById("code").value.trim().toUpperCase();

  if (!email || !code) {
    alert(t.emptyAlert);
    return;
  }

  const { data, error } = await supabaseClient
    .from("applications")
    .select("*")
    .eq("email", email)
    .eq("invite_code", code)
    .eq("status", "approved");

  if (error || !data || data.length === 0) {
    alert(t.wrongAlert);
    return;
  }

  localStorage.setItem("q_email", email);
  localStorage.setItem("q_code", code);

  window.location.href = "complete.html";
}

function goHome() {
  window.location.href = "index.html";
}

setLang(currentLang);

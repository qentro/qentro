<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Qentro Admin</title>
  <style>
    body {
      background: #000;
      color: white;
      font-family: sans-serif;
      padding: 30px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .card {
      border: 1px solid rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
    button {
      margin-top: 10px;
      margin-right: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .approve { background: green; color: white; }
    .reject { background: red; color: white; }
  </style>
</head>
<body>

<h1>Başvurular</h1>

<div id="list"></div>

<script>
async function loadApplications() {
  const res = await fetch("https://wfkyriteptajmwkyzvub.supabase.co/rest/v1/applications?select=*", {
    headers: {
      "apikey": "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX",
      "Authorization": "Bearer sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
    }
  });

  const data = await res.json();
  const container = document.getElementById("list");
  container.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${item.full_name}</b><br>
      ${item.email}<br><br>
      ${item.why_join}<br><br>

      <button class="approve" onclick="approve('${item.id}')">Onayla</button>
      <button class="reject" onclick="reject('${item.id}')">Reddet</button>
    `;

    container.appendChild(div);
  });
}

async function approve(id) {
  await fetch("https://wfkyriteptajmwkyzvub.supabase.co/rest/v1/applications?id=eq." + id, {
    method: "PATCH",
    headers: {
      "Content-Type": "application/json",
      "apikey": "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX",
      "Authorization": "Bearer sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
    },
    body: JSON.stringify({ status: "approved" })
  });

  loadApplications();
}

async function reject(id) {
  await fetch("https://wfkyriteptajmwkyzvub.supabase.co/rest/v1/applications?id=eq." + id, {
    method: "PATCH",
    headers: {
      "Content-Type": "application/json",
      "apikey": "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX",
      "Authorization": "Bearer sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
    },
    body: JSON.stringify({ status: "rejected" })
  });

  loadApplications();
}

loadApplications();
</script>

</body>
</html>

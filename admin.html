<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qentro | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #151515 0%, #080808 45%, #000 100%);
  color: #fff;
  padding: 40px 22px;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
}

h1 {
  font-size: 38px;
  margin: 0 0 10px;
}

p {
  color: #aaa;
  margin-bottom: 28px;
}

.card {
  background: rgba(22,22,22,0.78);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 18px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.4);
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.item {
  color: #ddd;
  font-size: 14px;
  line-height: 1.6;
}

.label {
  color: #888;
  font-size: 12px;
}

button {
  padding: 13px 18px;
  margin-top: 18px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  background: linear-gradient(90deg, #333, #222);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.12);
}

.code {
  margin-top: 12px;
  color: #fff;
  font-weight: 700;
}

.empty {
  color: #888;
  padding: 30px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">
  <h1>Qentro Admin</h1>
  <p>Bekleyen başvuruları incele ve uygun kişilere davet kodu oluştur.</p>

  <div id="applications"></div>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

function generateCode(length = 8) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < length; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

async function loadApplications() {
  const box = document.getElementById("applications");

  const { data, error } = await supabaseClient
    .from("applications")
    .select("*")
    .eq("status", "pending")
    .order("created_at", { ascending: false });

  if (error) {
    box.innerHTML = "<div class='empty'>Başvurular yüklenemedi: " + error.message + "</div>";
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "<div class='empty'>Bekleyen başvuru yok.</div>";
    return;
  }

  box.innerHTML = "";

  data.forEach(app => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="row">
        <div class="item"><div class="label">Ad Soyad</div>${app.full_name || "-"}</div>
        <div class="item"><div class="label">Email</div>${app.email || "-"}</div>
        <div class="item"><div class="label">Telefon</div>${app.phone || "-"}</div>
        <div class="item"><div class="label">Şehir / Ülke</div>${app.city || "-"} / ${app.country || "-"}</div>
        <div class="item"><div class="label">Meslek / İş Alanı</div>${app.business || app.profession || "-"}</div>
        <div class="item"><div class="label">Referans</div>${app.reference_name || "-"}</div>
      </div>

      <div class="item" style="margin-top:16px;">
        <div class="label">Neden Katılmak İstiyor?</div>
        ${app.reason || "-"}
      </div>

      <button onclick="approveApplication('${app.id}')">Onayla ve Davet Kodu Oluştur</button>
      <div id="code-${app.id}" class="code"></div>
    `;

    box.appendChild(card);
  });
}

async function approveApplication(id) {
  const code = generateCode();

  const { error } = await supabaseClient
    .from("applications")
    .update({
      status: "approved",
      invite_code: code
    })
    .eq("id", id);

  if (error) {
    alert("Onaylama hatası: " + error.message);
    return;
  }

  document.getElementById("code-" + id).innerText = "Davet Kodu: " + code;

  alert("Başvuru onaylandı. Davet kodu: " + code);
}

loadApplications();
</script>

</body>
</html>

<script>
function generateCode(len = 8) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 0/O/1/I yok
  let code = "";
  for (let i = 0; i < len; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

async function approve(id) {
  const code = generateCode(8);

  await fetch(
    "https://wfkyriteptajmwkyzvub.supabase.co/rest/v1/applications?id=eq." + id,
    {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "apikey": "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX",
        "Authorization": "Bearer sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
      },
      body: JSON.stringify({
        status: "approved",
        invite_code: code
      })
    }
  );

  alert("Onaylandı. Davet kodu: " + code);
  loadApplications();
}
</script>

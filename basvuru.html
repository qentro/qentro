<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 26%),
    radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 22%),
    linear-gradient(135deg, #050505, #0b0b0b 45%, #111 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 34px 24px;
}

.page {
  width: 100%;
  max-width: 760px;
}

.language-bar {
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.lang-btn {
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.78);
  padding: 9px 12px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 12px;
  letter-spacing: 0.05em;
}

.lang-btn.active,
.lang-btn:hover {
  background: #fff;
  color: #000;
}

.card {
  width: 100%;
  padding: 38px 34px;
  border-radius: 28px;
  background: rgba(22,22,22,0.78);
  border: 1px solid rgba(255,255,255,0.11);
  box-shadow: 0 35px 80px rgba(0,0,0,0.55);
}

h1 {
  font-size: 38px;
  margin: 0 0 10px;
  letter-spacing: -0.04em;
}

p {
  margin: 0 0 28px;
  color: rgba(255,255,255,0.68);
  font-size: 15px;
  line-height: 1.6;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: rgba(255,255,255,0.82);
  font-size: 14px;
  font-weight: 600;
}

input, textarea {
  width: 100%;
  padding: 15px 16px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.12);
  background: linear-gradient(90deg, #2a2a2a, #202020);
  color: #fff;
  outline: none;
  font-size: 15px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button, a {
  width: 100%;
  padding: 16px;
  margin-top: 10px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.13);
  background: linear-gradient(90deg, #333, #222);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  justify-content: center;
  align-items: center;
}

a {
  background: linear-gradient(90deg, #292929, #1b1b1b);
}

button:hover, a:hover {
  filter: brightness(1.12);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

#msg {
  margin-top: 18px;
  color: rgba(255,255,255,0.68);
  font-size: 14px;
  line-height: 1.5;
}

@media (max-width: 560px) {
  body {
    padding: 16px;
  }

  .card {
    padding: 30px 24px;
    border-radius: 24px;
  }

  h1 {
    font-size: 34px;
  }

  .lang-btn {
    font-size: 11px;
    padding: 8px 10px;
  }
}
</style>
</head>

let currentLang = localStorage.getItem("qentroLang") || "en";

function setLang(code) {
  const t = texts[code] || texts.en;
  currentLang = code;

  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.title = t.pageTitle;

  document.getElementById("title").innerHTML = t.title;
  document.getElementById("subtitle").innerHTML = t.subtitle;
  document.getElementById("fullNameLabel").innerHTML = t.fullNameLabel;
  document.getElementById("emailLabel").innerHTML = t.emailLabel;
  document.getElementById("phoneLabel").innerHTML = t.phoneLabel;
  document.getElementById("cityLabel").innerHTML = t.cityLabel;
  document.getElementById("countryLabel").innerHTML = t.countryLabel;
  document.getElementById("socialsLabel").innerHTML = t.socialsLabel;
  document.getElementById("professionLabel").innerHTML = t.professionLabel;
  document.getElementById("referralNameLabel").innerHTML = t.referralNameLabel;
  document.getElementById("referralPhoneLabel").innerHTML = t.referralPhoneLabel;
  document.getElementById("referralEmailLabel").innerHTML = t.referralEmailLabel;
  document.getElementById("whyJoinLabel").innerHTML = t.whyJoinLabel;
  document.getElementById("applyBtn").innerHTML = t.applyBtn;
  document.getElementById("homeBtn").innerHTML = t.homeBtn;

  document.querySelectorAll(".lang-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.lang === code);
  });

  localStorage.setItem("qentroLang", code);
}

document.querySelectorAll(".lang-btn").forEach(button => {
  button.addEventListener("click", function () {
    setLang(this.dataset.lang);
  });
});

document.getElementById("applyBtn").onclick = async function () {
  const t = texts[currentLang] || texts.en;
  const msg = document.getElementById("msg");
  const button = document.getElementById("applyBtn");

  msg.textContent = t.sending;
  button.disabled = true;

  const data = {

    email: document.getElementById("email").value.trim().toLowerCase(),
    phone: document.getElementById("phone").value.trim(),
    city: document.getElementById("city").value.trim(),
    country: document.getElementById("country").value.trim(),
    socials: document.getElementById("socials").value.trim(),
    profession: document.getElementById("profession").value.trim(),
    referral_name: document.getElementById("referral_name").value.trim(),
    referral_phone: document.getElementById("referral_phone").value.trim(),
    referral_email: document.getElementById("referral_email").value.trim(),
    why_join: document.getElementById("why_join").value.trim(),
    status: "pending"
  };

  if (!data.full_name || !data.email || !data.phone || !data.city || !data.country || !data.referral_name || !data.referral_phone || !data.referral_email || !data.why_join) {
    msg.textContent = t.required;
    button.disabled = false;
    return;
  }

  try {

      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX",
        "Authorization": "Bearer sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      const errorText = await response.text();
      msg.textContent = t.error + errorText;
      button.disabled = false;
      return;
    }

    window.location.href = "success.html";

  } catch (error) {
    msg.textContent = t.connectionError + error.message;
    button.disabled = false;
  }
};

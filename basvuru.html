<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qentro | Üyelik Başvurusu</title>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #151515 0%, #080808 45%, #000 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 50px 24px;
}

.card {
  width: 100%;
  max-width: 720px;
  padding: 38px 34px;
  border-radius: 28px;
  background: rgba(22,22,22,0.78);
  border: 1px solid rgba(255,255,255,0.09);
  box-shadow: 0 35px 80px rgba(0,0,0,0.55);
}

h1 {
  font-size: 38px;
  margin: 0 0 10px;
}

p {
  margin: 0 0 28px;
  color: #aaa;
  font-size: 15px;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #d0d0d0;
  font-size: 14px;
  font-weight: 600;
}

input, textarea {
  width: 100%;
  padding: 15px 16px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.11);
  background: linear-gradient(90deg, #2a2a2a, #202020);
  color: #fff;
  outline: none;
  font-size: 15px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button, a {
  width: 100%;
  padding: 16px;
  margin-top: 10px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.12);
  background: linear-gradient(90deg, #333, #222);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  justify-content: center;
  align-items: center;
}

a {
  background: linear-gradient(90deg, #292929, #1b1b1b);
}

#msg {
  margin-top: 18px;
  color: #aaa;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
  <h1>Üyelik Başvurusu Yap</h1>
  <p>Referansın yoksa başvuru bırakabilirsin. Uygun görülen başvurular incelenir.</p>

  <div class="field"><label>Ad Soyad</label><input id="full_name" type="text"></div>
  <div class="field"><label>Email</label><input id="email" type="email"></div>
  <div class="field"><label>Telefon</label><input id="phone" type="text"></div>
  <div class="field"><label>Şehir</label><input id="city" type="text"></div>
  <div class="field"><label>Ülke</label><input id="country" type="text"></div>

  <div class="field">
    <label>Sosyal Medya Hesapların</label>
    <textarea id="socials" placeholder="Instagram:&#10;LinkedIn:&#10;X:&#10;Facebook:"></textarea>
  </div>

  <div class="field"><label>Meslek / İş Alanı</label><input id="profession" type="text"></div>

  <div class="field"><label>Referans Kişi — en az 1 iş arkadaşı</label><input id="referral_name" type="text"></div>
  <div class="field"><label>Referans Telefon</label><input id="referral_phone" type="text"></div>
  <div class="field"><label>Referans Email</label><input id="referral_email" type="email"></div>

  <div class="field">
    <label>Neden katılmak istiyorsun?</label>
    <textarea id="why_join"></textarea>
  </div>

  <button id="applyBtn" type="button">Başvuruyu Gönder</button>
  <a href="index.html">Ana Sayfaya Dön</a>

  <div id="msg"></div>
</div>

<script>
document.getElementById("applyBtn").onclick = async function () {
  const msg = document.getElementById("msg");
  const button = document.getElementById("applyBtn");

  msg.textContent = "Gönderiliyor...";
  button.disabled = true;

  const data = {
    full_name: document.getElementById("full_name").value.trim(),
    email: document.getElementById("email").value.trim().toLowerCase(),
    phone: document.getElementById("phone").value.trim(),
    city: document.getElementById("city").value.trim(),
    country: document.getElementById("country").value.trim(),
    socials: document.getElementById("socials").value.trim(),
    profession: document.getElementById("profession").value.trim(),
    referral_name: document.getElementById("referral_name").value.trim(),
    referral_phone: document.getElementById("referral_phone").value.trim(),
    referral_email: document.getElementById("referral_email").value.trim(),
    why_join: document.getElementById("why_join").value.trim(),
    status: "pending"
  };

  if (!data.full_name || !data.email || !data.phone || !data.city || !data.country || !data.referral_name || !data.referral_phone || !data.referral_email || !data.why_join) {
    msg.textContent = "Lütfen zorunlu alanları doldur.";
    button.disabled = false;
    return;
  }

  try {
    const response = await fetch("https://wfkyriteptajmwkyzvub.supabase.co/rest/v1/applications", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX",
        "Authorization": "Bearer sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      const errorText = await response.text();
      msg.textContent = "Hata: " + errorText;
      button.disabled = false;
      return;
    }

    window.location.href = "success.html";

  } catch (error) {
    msg.textContent = "Bağlantı hatası: " + error.message;
    button.disabled = false;
  }
};
</script>

</body>
</html>

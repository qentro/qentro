<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qentro | Üyelik Başvurusu</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #050505, #0d0d0d 45%, #111 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    h1 { font-size: 40px; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.72); margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; }
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: #fff;
      outline: none;
    }
    textarea { min-height: 120px; resize: vertical; }
    button, a.btn {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.14);
      cursor: pointer;
      text-decoration: none;
      margin-top: 8px;
    }
    button:hover, a.btn:hover { background: rgba(255,255,255,0.12); }
    #msg { margin-top: 16px; color: rgba(255,255,255,0.9); font-size: 14px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Üyelik Başvurusu Yap</h1>
    <p>Referansın yoksa başvuru bırakabilirsin. Uygun görülen başvurular incelenir.</p>

    <div class="field">
      <label for="full_name">Ad Soyad</label>
      <input id="full_name" type="text" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" />
    </div>

    <div class="field">
      <label for="instagram">Instagram</label>
      <input id="instagram" type="text" />
    </div>

    <div class="field">
      <label for="profession">Meslek</label>
      <input id="profession" type="text" />
    </div>

    <div class="field">
      <label for="why_join">Neden katılmak istiyorsun?</label>
      <textarea id="why_join"></textarea>
    </div>

    <button id="applyBtn" type="button">Başvuruyu Gönder</button>
    <a class="btn" href="index.html">Ana Sayfaya Dön</a>
    <div id="msg"></div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://wfkyriteptajmwkyzvub.supabase.co",
      "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
    );

    const button = document.getElementById("applyBtn");
    const msg = document.getElementById("msg");

    button.addEventListener("click", async function () {
      msg.textContent = "Gönderiliyor...";
      button.disabled = true;

      const payload = {
        full_name: document.getElementById("full_name").value.trim(),
        email: document.getElementById("email").value.trim(),
        instagram: document.getElementById("instagram").value.trim(),
        profession: document.getElementById("profession").value.trim(),
        why_join: document.getElementById("why_join").value.trim()
      };

      if (!payload.full_name || !payload.email || !payload.why_join) {
        msg.textContent = "Zorunlu alanları doldur.";
        button.disabled = false;
        return;
      }

      const result = await supabaseClient.from("applications").insert([payload]);

      if (result.error) {
        msg.textContent = "Hata: " + result.error.message;
        button.disabled = false;
      } else {
        msg.textContent = "Başvurun gönderildi ✅";
      }
    });
  </script>
</body>
</html>

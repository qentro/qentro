<!DOCTYPE html>
<html lang="tr">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qentro | Üyelik Başvurusu</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #050505, #0d0d0d 45%, #111 100%);
      color: #fff; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 720px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 28px; padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    h1 { font-size: 40px; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.72); margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; }
    input, textarea {
      width: 100%; padding: 14px 16px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); color: #fff;
    }
    textarea { min-height: 120px; }
    button {
      width: 100%; padding: 16px; border-radius: 16px;
      background: rgba(255,255,255,0.08); color: #fff;
      border: 1px solid rgba(255,255,255,0.14); cursor: pointer;
    }
    #msg { margin-top: 16px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Üyelik Başvurusu Yap</h1>
    <p>Referansın yoksa başvuru bırakabilirsin.</p>

    <div class="field">
      <label>Ad Soyad</label>
      <input id="full_name">
    </div>

    <div class="field">
      <label>Email</label>
      <input id="email">
    </div>

    <div class="field">
      <label>Instagram</label>
      <input id="instagram">
    </div>

    <div class="field">
      <label>Meslek</label>
      <input id="profession">
    </div>

    <div class="field">
      <label>Neden katılmak istiyorsun?</label>
      <textarea id="why_join"></textarea>
    </div>

    <button id="applyBtn">Başvuruyu Gönder</button>
    <div id="msg"></div>
  </div>

<script>
const supabase = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

document.getElementById("applyBtn").addEventListener("click", async () => {

  const payload = {
    full_name: document.getElementById("full_name").value.trim(),
    email: document.getElementById("email").value.trim(),
    instagram: document.getElementById("instagram").value.trim(),
    profession: document.getElementById("profession").value.trim(),
    why_join: document.getElementById("why_join").value.trim()
  };

  if (!payload.full_name || !payload.email || !payload.why_join) {
    document.getElementById("msg").textContent = "Zorunlu alanları doldur.";
    return;
  }

  const { error } = await supabase.from("applications").insert([payload]);

  if (error) {
    document.getElementById("msg").textContent = "Hata: " + error.message;
  } else {
    document.getElementById("msg").textContent = "Başvurun gönderildi ✅";
  }
});
</script>

</body>
</html>

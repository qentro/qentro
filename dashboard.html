<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Qentro Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
body {
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
  padding-top: 100px;
}
button {
  padding: 10px 20px;
  margin-top: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Qentro Private Area</h1>
<p id="welcome">Kontrol ediliyor...</p>
<button onclick="logout()">Çıkış Yap</button>

<script>
const supabase = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

async function start() {
  const userResult = await supabase.auth.getUser();

  if (!userResult.data || !userResult.data.user) {
    window.location.href = "login.html";
    return;
  }

  const email = userResult.data.user.email;

  const profileResult = await supabase
    .from("users")
    .select("*")
    .eq("email", email)
    .maybeSingle();

  if (profileResult.error) {
    document.getElementById("welcome").innerText =
      "Profil okunamadı: " + profileResult.error.message;
    return;
  }

  if (profileResult.data && profileResult.data.name) {
    document.getElementById("welcome").innerText =
      "Hoşgeldin, " + profileResult.data.name;
  } else {
    document.getElementById("welcome").innerText =
      "Hoşgeldin. Profil bilgisi bulunamadı.";
  }
}

async function logout() {
  await supabase.auth.signOut();
  window.location.href = "login.html";
}

start();
</script>

</body>
</html>

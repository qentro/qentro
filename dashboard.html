<style>
body {
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;

}
button {
  padding: 10px 20px;

<body>

<h1>Qentro Private Area</h1>
<p>Hoşgeldin. Artık içeridesin.</p>

<button onclick="logout()">Çıkış Yap</button>

<script>
const supabase = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

async function checkUser() {
  const { data } = await supabase.auth.getUser();

  if (!data.user) {
    window.location.href = "login.html";
  }
}

checkUser();

async function logout() {
  await supabase.auth.signOut();
  window.location.href = "login.html";
}
</script>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qentro | Başvuru Alındı</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body {
      min-height:100vh;
      background:linear-gradient(135deg,#050505,#111);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      text-align:center;
    }
    .box {
      max-width:620px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      border-radius:28px;
      padding:44px 34px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }
    h1 { font-size:42px; margin-bottom:16px; }
    p { color:rgba(255,255,255,.72); line-height:1.6; margin-bottom:28px; }
    a {
      display:inline-flex;
      padding:15px 24px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.18);
      color:white;
      text-decoration:none;
      background:rgba(255,255,255,.08);
    }
    a:hover { background:rgba(255,255,255,.14); }
  </style>
</head>
<body>
  <div class="box">
    <h1>Başvurun alındı</h1>
    <p>Qentro üyelik başvurun incelenmek üzere kaydedildi. Uygun görülürsen seninle iletişime geçeceğiz.</p>
    <a href="index.html">Ana Sayfaya Dön</a>
  </div>
</body>
</html>

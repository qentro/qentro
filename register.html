<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Qentro - Üyelik Oluştur</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.box {
  width: 400px;
}
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}
button {
  background: #fff;
  color: #000;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>Üyelik Oluştur</h2>

  <input id="name" placeholder="Ad Soyad">
  <input id="email" placeholder="Email">
  <input id="ref" placeholder="Referans olan kişi">
  <input id="code" placeholder="Davet Kodu">

  <button onclick="nextStep()">Devam Et</button>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://wfkyriteptajmwkyzvub.supabase.co",
  "sb_publishable_mI4trhprac_kQGfb_5kO8A_Lonwh6KX"
);

async function nextStep() {
  const email = document.getElementById("email").value;
  const code = document.getElementById("code").value;

  const { data } = await supabase
    .from("applications")
    .select("*")
    .eq("email", email)
    .eq("invite_code", code)
    .eq("status", "approved");

  if (!data || data.length === 0) {
    alert("Kod veya email hatalı!");
    return;
  }

  // bilgileri sakla
  localStorage.setItem("q_name", document.getElementById("name").value);
  localStorage.setItem("q_email", email);
  localStorage.setItem("q_ref", document.getElementById("ref").value);

  window.location.href = "complete.html";
}
</script>

</body>
</html>
